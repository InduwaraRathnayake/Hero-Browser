<!DOCTYPE html>
<html>
  <head>
    <title>Explain with Gemini</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 16px;
        width: 320px;
        background: #0a1128;
        color: #e0e0e0;
      }
      h3 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #00b4d8;
        border-bottom: 1px solid #00b4d8;
        padding-bottom: 8px;
      }
      .card {
        background: #182040;
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        margin-bottom: 12px;
        border: 1px solid #00b4d8;
      }
      #result {
        font-size: 14px;
        line-height: 1.5;
        color: #e0e0e0;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        word-break: break-word;
        max-height: 200px;
        overflow-y: auto;
      }
      .empty {
        color: #90a0c0;
        font-style: italic;
      }
      input,
      select {
        width: calc(100% - 18px); /* Account for padding */
        padding: 8px;
        margin-bottom: 10px;
        background: #0a1128;
        border: 1px solid #00b4d8;
        border-radius: 6px;
        font-size: 14px;
        color: #e0e0e0;
        box-sizing: border-box;
      }
      .input-container {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      #question {
        flex: 1;
        min-width: 0; /* Prevents flex item from overflowing */
      }
      input:focus,
      select:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(0, 180, 216, 0.3);
      }
      button {
        background: #00b4d8;
        color: #0a1128;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        white-space: nowrap;
      }
      button:hover {
        background: #90e0ef;
      }
      #toggleButton {
        width: 100%;
        margin-top: 12px;
        background: #ef4444;
      }
      #toggleButton.enabled {
        background: #10b981;
      }
      #toggleButton:hover {
        opacity: 0.9;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: #00b4d8;
        font-weight: 500;
      }
      .settings-group {
        margin-bottom: 12px;
      }
      .tabs {
        display: flex;
        margin-bottom: 12px;
      }
      .tab {
        flex: 1;
        text-align: center;
        padding: 8px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        opacity: 0.7;
      }
      .tab.active {
        border-bottom: 2px solid #00b4d8;
        opacity: 1;
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
      .save-button {
        text-align: right;
        margin-top: 12px;
      }
      .api-key-container {
        position: relative;
      }
      .toggle-password {
        position: absolute;
        right: 30px;
        top: 18px;
        transform: translateY(-50%);
        cursor: pointer;
        color: #00b4d8;
        background: none;
        border: none;
        padding: 0;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
      }
      .toggle-password:hover {
        color: #90e0ef;
      }
      option {
        background: #0a1128;
      }
      select {
        max-height: 250px;
        overflow-y: auto;
      }
      .model-category {
        color: #00b4d8;
        font-weight: bold;
        padding: 5px;
        background: #0a1128;
        border-bottom: 1px solid #00b4d8;
      }
      optgroup {
        background: #0a1128;
      }
    </style>
  </head>
  <body>
    <h3>Gemini Assistant</h3>

    <div class="tabs">
      <div class="tab active" data-tab="results">Results</div>
      <div class="tab" data-tab="settings">Settings</div>
    </div>

    <div class="tab-content active" id="results-tab">
      <div class="card">
        <div id="result" class="empty">Select text -> Right click -> Explain</div>
      </div>
      <div class="card">
        <div class="input-container">
          <input
            type="text"
            id="question"
            placeholder="Ask a question about the selected text"
          />
          <button id="askButton">Ask</button>
        </div>
      </div>
      <button id="toggleButton">Enable Floating UI</button>
    </div>

    <div class="tab-content" id="settings-tab">
      <div class="card">
        <div class="settings-group">
          <label for="apiKey">Gemini API Key:</label>
          <div class="api-key-container">
            <input
              type="password"
              id="apiKey"
              placeholder="Enter your Gemini API key"
            />
            <div class="toggle-password" id="toggleApiKey" title="Show/Hide API Key">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </div>
          </div>
        </div>

        <div class="settings-group">
          <label for="modelSelect">Gemini Model:</label>
          <select id="modelSelect">
            <optgroup label="Gemini 2.5 Series">
                <option value="gemini-2.5-flash-lite">
                    Gemini 2.5 Flash-Lite (Recommended)
                </option>
                <option value="gemini-2.5-flash" selected>
                    Gemini 2.5 Flash (Fast)
                </option>
                <option value="gemini-2.5-pro">
                  Gemini 2.5 Pro (Most Powerful)
                </option>
            </optgroup>
            <optgroup label="Gemini 2.0 Series">
              <option value="gemini-2.0-pro">Gemini 2.0 Pro</option>
              <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
              <option value="gemini-2.0-flash-lite">
                Gemini 2.0 Flash-Lite (Fast)
              </option>
            </optgroup>
            <optgroup label="Gemini 1.5 Series">
              <option value="gemini-1.5-pro-002">
                Gemini 1.5 Pro 002
              </option>
              <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
              <option value="gemini-1.5-flash-002">
                Gemini 1.5 Flash 002
              </option>
              <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
              <option value="gemini-1.5-flash-8b">
                Gemini 1.5 Flash-8B (Efficient)
              </option>
            </optgroup>
          </select>
        </div>

        <div class="save-button">
          <button id="saveSettings">Save Settings</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Toggle API key visibility
        const toggleApiKeyBtn = document.getElementById("toggleApiKey");
        const apiKeyInput = document.getElementById("apiKey");

        // Set default model to Gemini 2.5 Flash
        const modelSelect = document.getElementById("modelSelect");
        modelSelect.value = "models/gemini-2.5-flash";

        // Fix the eye toggle button
        toggleApiKeyBtn.addEventListener("click", function () {
          if (apiKeyInput.type === "password") {
            apiKeyInput.type = "text";
            toggleApiKeyBtn.innerHTML = `
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            `;
          } else {
            apiKeyInput.type = "password";
            toggleApiKeyBtn.innerHTML = `
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            `;
          }
        });

        // Also save the default model if none is set yet
        chrome.storage.local.get("geminiModel", (data) => {
          if (!data.geminiModel) {
            chrome.storage.local.set({ geminiModel: "models/gemini-2.5-flash" });
          }
        });
      });
    </script>
  </body>
</html>
